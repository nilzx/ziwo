# Publishes the npm package `@ziwo/memory` when a version tag is pushed.
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# The tag must be the version in worker/package.json. Run by hand instead
# (Actions > Release > Run workflow), it builds and checks everything and
# publishes nothing, even when manually selected on a tag. Prereleases use
# npm's next channel; stable versions use latest.
#
# Two jobs, on purpose. "package" installs the dependencies, runs the tests and
# builds the tarball; it holds no right to publish. "publish" holds that right
# (npm trusted publishing, by OIDC: no token is stored anywhere) and runs
# npm on the tarball the first job checked, then records the GitHub release.
#
# npm must be told to trust this workflow, once: on npmjs.com, the package's
# Settings > Trusted Publisher > GitHub Actions, with this repository and the
# file name release.yml, and "npm publish" among the allowed actions.

name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
      channel: ${{ steps.policy.outputs.channel }}
      prerelease: ${{ steps.policy.outputs.prerelease }}
      version: ${{ steps.policy.outputs.version }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate version and publication channel
        id: policy
        run: node scripts/release-policy.mjs
      - run: npm ci
      - run: npm ci --prefix ../adapters/codex/native --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm test
      # Packs, installs the tarball into a scratch directory, runs it signed in
      # to nothing, compares its upload with the repository's, and runs the
      # smoke suite on the prebuilt Worker.
      - run: npm run check:npm -- --artifact-dir "$RUNNER_TEMP/checked-package"
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/checked-package/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.package.outputs.publish == 'true'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify the checked artifact
        run: sha256sum -c SHA256SUMS
      - name: Publish
        env:
          NPM_CHANNEL: ${{ needs.package.outputs.channel }}
        run: |
          npm --version
          npm publish ./ziwo-*.tgz --access public --tag "$NPM_CHANNEL" --provenance
      - name: Record the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.package.outputs.prerelease }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes)
          if [ "$IS_PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}"
