# Publishes the npm package `@ziwo/memory` when a version tag is pushed.
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# The tag must be the version in worker/package.json. Run by hand instead
# (Actions > Release > Run workflow), it builds and checks everything and
# publishes nothing.
#
# Two jobs, on purpose. "package" installs the dependencies, runs the tests and
# builds the tarball; it holds no right to publish. "publish" holds that right
# (npm trusted publishing, by OIDC: no token is stored anywhere) and runs
# nothing but npm on the tarball the first job checked.
#
# npm must be told to trust this workflow, once: on npmjs.com, the package's
# Settings > Trusted Publisher > GitHub Actions, with this repository and the
# file name release.yml, and "npm publish" among the allowed actions.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: The tag is the version
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, but worker/package.json says $version"
            exit 1
          fi
      - run: npx tsc --noEmit
      - run: npm test
      # Packs, installs the tarball into a scratch directory, runs it signed in
      # to nothing, compares its upload with the repository's, and runs the
      # smoke suite on the prebuilt Worker.
      - run: npm run check:npm
      - name: Pack what was checked
        run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: worker/pkg
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/ziwo-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish
        run: |
          npm --version
          npm publish ./ziwo-*.tgz --access public
